<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio - Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        .form-grupo { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #e67e22; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Control de Gimnasio</h2>
        <!-- El JS busca este ID exacto para controlar el evento de submit -->
        <form id="iniciarsesion">
            <div class="form-grupo">
                <label for="correo">Correo Electrónico:</label>
                <!-- El JS leerá lo que se escriba en este ID -->
                <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="form-grupo">
                <label for="password">Contraseña:</label>
                <!-- El JS leerá lo que se escriba en este ID -->
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit">Entrar al Sistema</button>
        </form>
    </div>

    <!-- 🏛️ ORDEN ESTRICTO DE SCRIPTS -->
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
